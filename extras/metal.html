<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="description" content="Tu metal sagrado según la tradición cabalística">
<title>✦ Tu Metal Sagrado — Yejidá ✦</title>
<link rel="stylesheet" href="../style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✡</text></svg>">
</head>
<body>
<div id="sacred-bg"><canvas id="geo-canvas"></canvas></div>
<div class="floating-letters" id="floaters" aria-hidden="true"></div>
<main id="main" class="container" role="main">

<header class="page-header">
  <div class="hebrew-title">מתכת</div>
  <h1>✦ Tu Metal Sagrado ✦</h1>
  <p>Los metales de las Sefirot</p>
  <span class="page-number">Extras · Metal</span>
</header>

<section>
  <h2>⚙️ Los 7 Metales Sagrados</h2>
  <p>La tradición asocia <strong>7 metales</strong> a los 7 planetas clásicos
  y a las Sefirot inferiores. Cada uno vibra con una energía particular.</p>
  <form id="metal-form" autocomplete="off">
    <div class="form-grid">
      <div class="form-field full">
        <label for="fecha">Fecha de nacimiento</label>
        <input type="date" id="fecha" required>
      </div>
    </div>
    <div style="text-align:center;margin-top:1.2rem">
      <button type="submit" class="btn">✦ Revelar mi Metal ✦</button>
    </div>
  </form>
</section>

<div id="results" style="display:none"></div>

</main>
<footer class="footer">
  <div class="sigil-row" aria-hidden="true">✡ ✦ ☰ ✦ ✡</div>
  <p>Proyecto Yejidá Kabaláh · Metal Sagrado</p>
</footer>
<script src="../shared.js"></script>
<script>
const METALES = [
  { m:'Oro',       sym:'☉', p:'Sol',      sef:'Tiféret', heb:'זהב',  d:'Rey de los metales. Belleza, éxito, autoridad.' },
  { m:'Plata',     sym:'☾', p:'Luna',     sef:'Yesod',   heb:'כסף',  d:'Metal lunar. Intuición, emoción, pureza.' },
  { m:'Hierro',    sym:'♂', p:'Marte',    sef:'Guevurá', heb:'ברזל', d:'Metal marcial. Fuerza, coraje, protección.' },
  { m:'Estaño',    sym:'♃', p:'Júpiter',  sef:'Jesed',   heb:'בדיל', d:'Metal benéfico. Expansión, abundancia.' },
  { m:'Cobre',     sym:'♀', p:'Venus',    sef:'Netzaj',  heb:'נחושת',d:'Metal venusino. Amor, arte, atracción.' },
  { m:'Mercurio',  sym:'☿', p:'Mercurio', sef:'Hod',     heb:'כספית',d:'Metal del mensajero. Comunicación, cambio.' },
  { m:'Plomo',     sym:'♄', p:'Saturno',  sef:'Biná',    heb:'עופרת',d:'Metal del tiempo. Disciplina, límite, sabiduría.' }
];

function reduce(n){
  while(n > 9){
    if([11,22,33].includes(n)) return n;
    n = String(n).split('').reduce((a,b) => a + +b, 0);
  }
  return n;
}

document.getElementById('metal-form').addEventListener('submit', (e) => {
  e.preventDefault();
  const f = document.getElementById('fecha').value;
  if(!f) return;
  const d = new Date(f + 'T12:00:00');
  const dia = d.getDate();
  const metal = METALES[dia % 7];
  const camino = reduce(dia + d.getMonth() + 1 + d.getFullYear());

  const results = document.getElementById('results');
  results.style.display = 'block';
  results.innerHTML = `
    <section>
      <h2>⚙️ Tu Metal Sagrado</h2>
      <div class="equation">
        <div class="big">${metal.m}</div>
        <div class="heb">${metal.heb}</div>
      </div>
      <div class="result-grid">
        <div class="result-card">
          <div class="label">Planeta</div>
          <div class="value" style="font-size:1.3rem;">${metal.sym} ${metal.p}</div>
        </div>
        <div class="result-card">
          <div class="label">Sefirá</div>
          <div class="value" style="font-size:1.3rem;">${metal.sef}</div>
        </div>
        <div class="result-card">
          <div class="label">Camino de Vida</div>
          <div class="value">${camino}</div>
        </div>
      </div>
      <p style="text-align:center;margin-top:1rem;color:var(--text);">
        ${metal.d}
      </p>
    </section>
    <section>
      <h2>💡 Los 7 Metales</h2>
      <table>
        <thead><tr><th>Metal</th><th>Planeta</th><th>Sefirá</th><th>Hebreo</th></tr></thead>
        <tbody>
          ${METALES.map(m => `<tr>
            <td>${m.m}</td><td>${m.sym} ${m.p}</td>
            <td>${m.sef}</td><td class="hebrew-inline">${m.heb}</td>
          </tr>`).join('')}
        </tbody>
      </table>
    </section>
  `;
  results.scrollIntoView({ behavior:'smooth' });
});
</script>
</body>
</html>
