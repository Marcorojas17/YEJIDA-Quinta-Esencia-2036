<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="description" content="Glosario cabalístico: 100+ términos hebreo-español buscables">
<title>✦ Glosario Cabalístico — Yejidá ✦</title>
<link rel="stylesheet" href="../style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✡</text></svg>">
<style>
.busqueda{margin:1.5rem 0;}
.busqueda input{width:100%;padding:1rem 1.2rem;background:rgba(10,12,30,.7);
  border:1px solid var(--line);border-radius:12px;color:var(--text);
  font-size:1rem;font-family:inherit;}
.busqueda input:focus{outline:none;border-color:var(--gold);
  box-shadow:0 0 25px rgba(212,175,55,.3);}
.termino{padding:.9rem 1.1rem;background:rgba(10,12,30,.6);
  border:1px solid var(--line);border-radius:10px;margin-bottom:.5rem;
  transition:all .3s;}
.termino:hover{border-color:var(--gold);transform:translateX(4px);}
.termino .palabra{color:var(--gold2);font-weight:600;
  font-size:1rem;display:flex;justify-content:space-between;
  align-items:baseline;gap:.8rem;flex-wrap:wrap;}
.termino .palabra .heb{font-family:var(--font-heb);direction:rtl;
  color:var(--gold);font-size:1.15rem;}
.termino .def{color:var(--text);font-size:.88rem;margin-top:.3rem;}
.contador{text-align:center;color:var(--muted);font-size:.85rem;
  margin-bottom:1rem;}
</style>
</head>
<body>
<div id="sacred-bg"><canvas id="geo-canvas"></canvas></div>
<div class="floating-letters" id="floaters" aria-hidden="true"></div>
<main id="main" class="container" role="main">

<header class="page-header">
  <div class="hebrew-title">מונחים</div>
  <h1>✦ Glosario Cabalístico ✦</h1>
  <p>100+ términos hebreo-español</p>
  <span class="page-number">Aprender · Glosario</span>
</header>

<section>
  <h2>🔍 Buscar Término</h2>
  <div class="busqueda">
    <input type="search" id="busqueda" placeholder="Busca por palabra, transliteración o definición..." autofocus aria-label="Buscar">
  </div>
  <div class="contador" id="contador"></div>
  <div id="terminos"></div>
</section>

</main>
<footer class="footer">
  <div class="sigil-row" aria-hidden="true">✡ ✦ ☰ ✦ ✡</div>
  <p>Proyecto Yejidá Kabaláh · Glosario</p>
</footer>

document.addEventListener('DOMContentLoaded', () => {
  renderGlosario(TERMINOS);
  document.getElementById('busqueda').addEventListener('input', (e) => {
    const q = e.target.value.toLowerCase().trim();
    if(q.length < 2){
      renderGlosario(TERMINOS);
      return;
    }
    const filtered = TERMINOS.filter(t =>
      t.t.toLowerCase().includes(q) ||
      t.h.includes(e.target.value) ||
      t.d.toLowerCase().includes(q)
    );
    renderGlosario(filtered);
  });
});

function renderGlosario(lista){
  document.getElementById('contador').textContent =
    `${lista.length} términos`;
  document.getElementById('terminos').innerHTML = lista.map(t => `
    <div class="termino">
      <div class="palabra">
        <span>${t.t}</span>
        <span class="heb">${t.h}</span>
      </div>
      <div class="def">${t.d}</div>
    </div>
  `).join('') || '<p style="text-align:center;color:var(--muted);padding:2rem;">Sin resultados.</p>';
}
