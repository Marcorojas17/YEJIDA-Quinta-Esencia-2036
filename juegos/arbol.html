<style>
.arbol-zona{display:grid;grid-template-columns:1fr 1fr;gap:1.5rem;
  align-items:start;margin:1.5rem 0;}
@media(max-width:700px){.arbol-zona{grid-template-columns:1fr;}}
.arbol-svg{background:radial-gradient(circle at 50% 40%,
  rgba(108,92,231,.1), transparent 70%), rgba(5,6,15,.6);
  border:1px solid var(--line);border-radius:14px;padding:1rem;}
.arbol-svg .nodo{cursor:pointer;transition:all .4s;}
.arbol-svg .nodo circle{fill:rgba(212,175,55,.1);
  stroke:var(--gold);stroke-width:2;stroke-dasharray:4 3;}
.arbol-svg .nodo.lleno circle{fill:rgba(212,175,55,.3);
  stroke:var(--gold2);stroke-dasharray:none;}
.arbol-svg .nodo.lleno text{fill:var(--gold2);}
.arbol-svg .nodo text{fill:var(--muted);font-size:11px;
  text-anchor:middle;pointer-events:none;font-weight:600;}
.banco{display:grid;grid-template-columns:repeat(2,1fr);gap:.6rem;}
.ficha{padding:.9rem .6rem;background:rgba(10,12,30,.7);
  border:1px solid var(--line);border-radius:10px;
  color:var(--gold2);font-family:var(--font-heb);font
