<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="description" content="Quiz relámpago: 15 preguntas en 60 segundos">
<title>✦ Quiz Relámpago — Yejidá ✦</title>
<link rel="stylesheet" href="../style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✡</text></svg>">
<style>
.barra-tiempo{height:8px;background:rgba(212,175,55,.15);border-radius:4px;
  overflow:hidden;margin:1rem 0;}
.barra-tiempo > div{height:100%;background:linear-gradient(90deg,var(--gold),var(--gold2));
  transition:width 1s linear;}
.pregunta-card{text-align:center;padding:2rem 1.5rem;
  background:radial-gradient(circle, rgba(108,92,231,.12), transparent 70%),
  rgba(5,6,15,.7);border:2px solid var(--gold);border-radius:20px;
  box-shadow:0 0 40px rgba(212,175,55,.3);}
.pregunta-card .num{color:var(--muted);font-family:var(--font-mono);
  font-size:.85rem;letter-spacing:.15em;margin-bottom:1rem;}
.pregunta-card h3{color:var(--gold2);font-size:1.3rem;line-height:1.5;}
.opciones-relampago{display:grid;gap:.6rem;margin-top:1.5rem;}
.op-rel{text-align:left;padding:1rem 1.2rem;background:rgba(10,12,30,.7);
  border:1px solid var(--line);border-radius:10px;color:var(--text);
  font-family:inherit;font-size:.95rem;cursor:pointer;transition:all .3s;}
.op-rel:hover{border-color:var(--gold);background:rgba(212,175,55,.08);}
.op-rel.correcta{border-color:var(--success);background:rgba(74,222,128,.2);
  color:var(--success);font-weight:600;}
.op-rel.incorrecta{border-color:var(--danger);background:rgba(255,107,107,.2);
  color:var(--danger);}
.op-rel:disabled{cursor:default;}
.stats-juego{display:flex;gap:1rem;justify-content:center;flex-wrap:wrap;
  margin-bottom:1rem;}
.stat{text-align:center;padding:.6rem 1.2rem;background:rgba(10,12,30,.6);
  border:1px solid var(--line);border-radius:10px;min-width:90px;}
.stat .num{color:var(--gold2);font-size:1.3rem;font-family:var(--font-mono);}
.stat .lbl{color:var(--muted);font-size:.7rem;letter-spacing:.15em;
  text-transform:uppercase;}
</style>
</head>
<body>
<div id="sacred-bg"><canvas id="geo-canvas"></canvas></div>
<div class="floating-letters" id="floaters" aria-hidden="true"></div>
<main id="main" class="container" role="main">

<header class="page-header">
  <div class="hebrew-title">חידון בזק</div>
  <h1>✦ Quiz Relámpago ✦</h1>
  <p>15 preguntas · 60 segundos</p>
  <span class="page-number">Juegos · Quiz</span>
</header>

<section>
  <div class="stats-juego">
    <div class="stat"><div class="num" id="ronda">0/15</div><div class="lbl">Pregunta</div></div>
    <div class="stat"><div class="num" id="tiempo">60s</div><div class="lbl">Tiempo</div></div>
    <div class="stat"><div class="num" id="aciertos">0</div><div class="lbl">Aciertos</div></div>
  </div>

  <div class="barra-tiempo"><div id="barra" style="width:100%"></div></div>

  <div class="pregunta-card" id="pregunta-card">
    <div style="color:var(--muted);">Presiona iniciar para comenzar el quiz.</div>
  </div>

  <div style="text-align:center;margin-top:1.5rem;">
    <button id="iniciar" class="btn">✦ Iniciar Quiz ✦</button>
  </div>
</section>

</main>
<footer class="footer">
  <div class="sigil-row" aria-hidden="true">✡ ✦ ☰ ✦ ✡</div>
  <p>Proyecto Yejidá Kabaláh · Quiz Relámpago</p>
</footer>
<script src="../shared.js"></script>
<script>
const PREGUNTAS = [
  { p:'¿Cuántos niveles tiene el alma?', o:['3','5','7'], c:1 },
  { p:'¿Qué significa Yejidá?', o:['Unidad','Vida','Corona'], c:0 },
  { p:'¿Cuántas Sefirot hay?', o:['7','10','12'], c:1 },
  { p:'¿Quién introdujo el Tzimtzum?', o:['Baal Shem Tov','Isaac Luria','Moisés de León'], c:1 },
  { p:'¿Cuántas letras tiene el hebreo?', o:['20','22','24'], c:1 },
  { p:'¿Qué significa Shejiná?', o:['Presencia divina','Corona','Sabiduría'], c:0 },
  { p:'¿Qué es la Guematria?', o:['Oración','Valor numérico','Meditación'], c:1 },
  { p:'¿Qué Sefirá es la Corona?', o:['Kéter','Jojmá','Biná'], c:0 },
  { p:'¿Cuántos mundos hay?', o:['3','4','5'], c:1 },
  { p:'¿Qué es el Tikkun Olam?', o:['Creación','Ruptura','Reparación'], c:2 },
  { p:'¿Cuántos Nombres tiene el Shem?', o:['22','42','72'], c:2 },
  { p:'¿Qué es el Zohar?', o:['Un profeta','El Libro del Esplendor','Una Sefirá'], c:1 },
  { p:'¿Cuántas Mitzvot hay?', o:['248','365','613'], c:2 },
  { p:'¿Qué significa Teshuvá?', o:['Retorno','Oración','Ayuno'], c:0 },
  { p:'¿Qué es Adam Kadmon?', o:['Un ángel','El Hombre Primordial','Una Sefirá'], c:1 }
];

const TOTAL_TIEMPO = 60;
let idx = 0;
let aciertos = 0;
let tiempo = TOTAL_TIEMPO;
let activo = false;
let timerId = null;

function iniciar(){
  idx = 0;
  aciertos = 0;
  tiempo = TOTAL_TIEMPO;
  activo = true;
  document.getElementById('iniciar').style.display = 'none';
  document.getElementById('aciertos').textContent = 0;
  document.getElementById('tiempo').textContent = tiempo + 's';
  document.getElementById('barra').style.width = '100%';
  // mezclar preguntas
  PREGUNTAS.sort(() => Math.random() - 0.5);
  mostrarPregunta();
  timerId = setInterval(() => {
    tiempo--;
    document.getElementById('tiempo').textContent = tiempo + 's';
    document.getElementById('barra').style.width = (tiempo / TOTAL_TIEMPO * 100) + '%';
    if(tiempo <= 0) finalizar();
  }, 1000);
}

function mostrarPregunta(){
  if(idx >= PREGUNTAS.length){
    finalizar();
    return;
  }
  const q = PREGUNTAS[idx];
  document.getElementById('ronda').textContent = `${idx + 1}/${PREGUNTAS.length}`;
  document.getElementById('pregunta-card').innerHTML = `
    <div class="num">PREGUNTA ${idx + 1}</div>
    <h3>${q.p}</h3>
    <div class="opciones-relampago">
      ${q.o.map((op, i) => `<button class="op-rel" data-i="${i}">${op}</button>`).join('')}
    </div>
  `;
  document.querySelectorAll('.op-rel').forEach(btn => {
    btn.addEventListener('click', () => responder(parseInt(btn.dataset.i), q.c));
  });
}

function responder(i, c){
  if(!activo) return;
  const btns = document.querySelectorAll('.op-rel');
  btns.forEach((b, bi) => {
    b.disabled = true;
    if(bi === c) b.classList.add('correcta');
    else if(bi === i) b.classList.add('incorrecta');
  });
  if(i === c){
    aciertos++;
    document.getElementById('aciertos').textContent = aciertos;
  }
  setTimeout(() => {
    idx++;
    if(activo) mostrarPregunta();
  }, 500);
}

function finalizar(){
  activo = false;
  clearInterval(timerId);
  document.getElementById('iniciar').style.display = 'inline-block';
  document.getElementById('pregunta-card').innerHTML = `
    <div style="text-align:center;padding:1.5rem;">
      <div style="font-size:3rem;color:var(--gold2);font-family:var(--font-mono);">
        ${aciertos}/${PREGUNTAS.length}
      </div>
      <p style="color:var(--gold2);font-size:1.2rem;margin:1rem 0;">
        ${aciertos >= 13 ? '✦ Maestro Relámpago ✦' :
          aciertos >= 10 ? '◈ Excelente velocidad ◈' :
          aciertos >= 6 ? '◈ Buen nivel ◈' : '⚠️ Sigue practicando'}
      </p>
      <p style="color:var(--muted);font-size:.9rem;">
        Tiempo restante: ${tiempo}s
      </p>
    </div>
  `;
}

document.getElementById('iniciar').addEventListener('click', iniciar);
</script>
</body>
</html>
