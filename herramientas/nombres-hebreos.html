<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="description" content="Tu nombre en hebreo con transliteración y valor numérico">
<title>✦ Tu Nombre en Hebreo — Yejidá ✦</title>
<link rel="stylesheet" href="../style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✡</text></svg>">
</head>
<body>
<div id="sacred-bg"><canvas id="geo-canvas"></canvas></div>
<div class="floating-letters" id="floaters" aria-hidden="true"></div>
<main id="main" class="container" role="main">

<header class="page-header">
  <div class="hebrew-title">שמות</div>
  <h1>✦ Tu Nombre en Hebreo ✦</h1>
  <p>Transliteración · Valor numérico</p>
  <span class="page-number">Herramienta · Nombres</span>
</header>

<section>
  <h2>✍️ Escribe tu nombre</h2>
  <form id="nombre-form" autocomplete="off">
    <div class="form-grid">
      <div class="form-field full">
        <label for="nombre">Nombre (en español)</label>
        <input type="text" id="nombre" placeholder="Ej: María, David, Ana" required>
      </div>
    </div>
    <div style="text-align:center;margin-top:1.2rem">
      <button type="submit" class="btn">✦ Transliterar al Hebreo ✦</button>
    </div>
  </form>
</section>

<div id="results" style="display:none"></div>
</main>
<footer class="footer">
  <div class="sigil-row" aria-hidden="true">✡ ✦ ☰ ✦ ✡</div>
  <p>Proyecto Yejidá Kabaláh · Nombres Hebreos</p>
</footer>
<script src="../shared.js"></script>
<script>
// Transliteración por fonemas
const TRANS = {
  'a':'א','b':'ב','c':'כ','d':'ד','e':'א','f':'פ','g':'ג','h':'ה',
  'i':'י','j':'ח','k':'כ','l':'ל','m':'מ','n':'נ','o':'ו','p':'פ',
  'q':'ק','r':'ר','s':'ס','t':'ט','u':'ו','v':'ב','w':'ו','x':'קס',
  'y':'י','z':'ז',
  'á':'א','é':'א','í':'י','ó':'ו','ú':'ו',
  'ñ':'ני','ch':'צ','sh':'ש','ll':'י','rr':'ר','tz':'צ'
};
const GEMATRIA = {
  'א':1,'ב':2,'ג':3,'ד':4,'ה':5,'ו':6,'ז':7,'ח':8,'ט':9,
  'י':10,'כ':20,'ל':30,'מ':40,'נ':50,'ס':60,'ע':70,'פ':80,'צ':90,
  'ק':100,'ר':200,'ש':300,'ת':400
};
// Nombres hebreos tradicionales (los más comunes)
const NOMBRES_TRAD = {
  'maria':'מרים','miriam':'מרים','jose':'יוסף','yoseph':'יוסף',
  'david':'דוד','salomon':'שלמה','shlomo':'שלמה','ana':'חנה',
  'juana':'יוחנה','juan':'יוחנן','yonatan':'יהונתן','elias':'אליהו',
  'eliyahu':'אליהו','moises':'משה','moshe':'משה','abraham':'אברהם',
  'avraham':'אברהם','sara':'שרה','sarah':'שרה','rebeca':'רבקה',
  'rivka':'רבקה','rachel':'רחל','raquel':'רחל','lea':'לאה',
  'esther':'אסתר','ester':'אסתר','mordejai':'מרדכי','aaron':'אהרן',
  'aharon':'אהרן','samuel':'שמואל','shmuel':'שמואל','dina':'דינה',
  'noemi':'נעמי','noemi2':'נעמי','ruth':'רות','rut':'רות','judit':'יהודית',
  'yehuda':'יהודה','benjamin':'בנימין','binyamin':'בנימין','daniel':'דניאל',
  'gabriel':'גבריאל','rafael':'רפאל','miguel':'מיכאל','uri':'אורי'
};

function reduce(n){
  while(n > 9){
    if([11,22,33].includes(n)) return n;
    n = String(n).split('').reduce((a,b) => a + +b, 0);
  }
  return n;
}

function transcribir(nombre){
  const clean = nombre.toLowerCase().normalize('NFD')
    .replace(/[\u0300-\u036f]/g, '').replace(/[^a-z]/g, '');
  // Buscar nombre tradicional
  if(NOMBRES_TRAD[clean]) return NOMBRES_TRAD[clean];
  // Transliterar fonéticamente
  let hebreo = '';
  const lower = nombre.toLowerCase();
  let i = 0;
  while(i < lower.length){
    // Dígrafos
    const digrafo = lower.substr(i, 2);
    if(['ch','sh','ll','rr','tz','ñ'].includes(digrafo)){
      hebreo += TRANS[digrafo] || '';
      i += 2;
      continue;
    }
    const ch = lower[i];
    if(TRANS[ch]) hebreo += TRANS[ch];
    i++;
  }
  return hebreo || '—';
}

document.getElementById('nombre-form').addEventListener('submit', (e) => {
  e.preventDefault();
  const nombre = document.getElementById('nombre').value.trim();
  if(!nombre) return alert('Escribe tu nombre.');

  const hebreo = transcribir(nombre);
  let valor = 0;
  const letras = [];
  for(const ch of hebreo){
    if(GEMATRIA[ch]){
      valor += GEMATRIA[ch];
      letras.push({ l: ch, v: GEMATRIA[ch] });
    }
  }
  const reducido = valor ? reduce(valor) : 0;

  const results = document.getElementById('results');
  results.style.display = 'block';
  results.innerHTML = `
    <section>
      <h2>✦ Tu Nombre en Hebreo ✦</h2>
      <div class="equation">
        <div class="big">${nombre}</div>
        <div class="heb" style="font-size:3rem;margin-top:1rem;">${hebreo}</div>
      </div>
    </section>

    <section>
      <h2>🔢 Valor Numérico (Guematria)</h2>
      <div class="result-grid">
        <div class="result-card">
          <div class="label">Guematria</div>
          <div class="value">${valor}</div>
          <div class="desc">Suma total de las letras.</div>
        </div>
        <div class="result-card">
          <div class="label">Reducido</div>
          <div class="value">${reducido}</div>
          <div class="desc">Vibración numerológica.</div>
        </div>
      </div>
    </section>

    <section>
      <h2>📖 Desglose Letra por Letra</h2>
      <table>
        <thead><tr><th>Hebreo</th><th>Valor</th><th>Nombre</th></tr></thead>
        <tbody>
          ${letras.map(l => {
            const nombres = {
              'א':'Alef','ב':'Bet','ג':'Guimel','ד':'Dalet','ה':'He','ו':'Vav',
              'ז':'Zayin','ח':'Jet','ט':'Tet','י':'Yud','כ':'Kaf','ל':'Lamed',
              'מ':'Mem','נ':'Nun','ס':'Samej','ע':'Ayin','פ':'Pe','צ':'Tzadi',
              'ק':'Kuf','ר':'Resh','ש':'Shin','ת':'Tav'
            };
            return `<tr><td class="hebrew-inline">${l.l}</td>
              <td>${l.v}</td><td>${nombres[l.l] || '—'}</td></tr>`;
          }).join('')}
        </tbody>
      </table>
    </section>

    <section>
      <h2>💡 Sobre los Nombres Hebreos</h2>
      <p>En la tradición, el <strong>nombre</strong> no es una etiqueta sino un
      <strong>canal del alma</strong>. Cada letra es una fuerza, y la combinación
      única de tu nombre revela la <strong>misión particular</strong> de tu alma.</p>
      <p>Cambiar de nombre (como hicieron Abraham, Sara, Jacob) cambia el destino,
      porque cambia el canal por el que fluye la bendición.</p>
    </section>
  `;
  results.scrollIntoView({ behavior:'smooth' });
});
</script>
</body>
</html>
